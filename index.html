<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrera Obstétrica 3D</title>
<style>
:root{--bg:#fff;--fg:#14213d;--card:rgba(255,255,255,.92);--ac:#d90429;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b132b;--fg:#f1f5f9;--card:rgba(11,19,43,.9)}}
:root[data-theme="dark"]{--bg:#0b132b;--fg:#f1f5f9;--card:rgba(11,19,43,.9)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.box{position:absolute;background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.5}
#hud{top:10px;left:10px}#help{top:10px;right:10px;font-size:13px}
#msg{top:60px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;display:none}
#modal{top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,520px);display:none;z-index:5}
#modal button{display:block;width:100%;margin:8px 0;padding:11px;border-radius:8px;border:2px solid var(--ac);background:transparent;color:var(--fg);font-size:16px;cursor:pointer}
#modal button:hover{background:var(--ac);color:#fff}
#modal h3{margin:0 0 8px;color:var(--ac)}
#touch{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:none;justify-content:space-between;padding:0 14px}
#touch div{display:flex;gap:10px}
#touch button{width:62px;height:62px;border-radius:50%;border:none;background:var(--card);color:var(--fg);font-size:22px;touch-action:none}
@media (hover:none){#touch{display:flex}#help{display:none}}
body:not(.jugando) #hud,body:not(.jugando) #help,body:not(.jugando) #touch{display:none!important}
#portada{position:fixed;inset:0;z-index:20;box-sizing:border-box;background:#0a2a6e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#portada img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:12px}
#jugar{padding:14px 46px;font-size:22px;font-weight:700;border:none;border-radius:12px;background:#1d4ed8;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0b2a8a}
</style></head><body>

box([0,-.65,LARGO/2+5],[60,1,LARGO+60],0x408c47);
box([0,-.08,LARGO/2+5],[13,.2,LARGO+40],0x2d3038);
for(let z=0;z<=LARGO+20;z+=10){
 box([0,.035,z],[.16,.03,4.5],0xffffff);
 const c=(z/10)%2?0xffffff:0xe01e2d;
 box([-6.25,.05,z],[.35,.12,10],c);box([6.25,.05,z],[.35,.12,10],c)}
for(let z=25;z<LARGO;z+=18){box([-9,1.2,z],[1.1,2.4,1.1],0x1f6b2e);box([9,1.2,z+8],[1.1,2.4,1.1],0x1f6b2e)}

box([-13,3,NIVEL*2+60],[5,6,12],0xf2a6b8);box([13,3,NIVEL*3+60],[5,6,12],0xa6d9bf);

for(let j=0;j<7;j++){const p=250+250*j;pads.push(p);
 const b=box([0,.05,p+7],[11,.05,14],0x00bcd4);b.material.emissive.setHex(0x007c91);

for(let z=0,i=0;z<LARGO+20;z+=20,i++){const c=i%2?0xffffff:0xe01e2d;box([-7.3,.45,z+10],[.3,.9,19.6],c);box([7.3,.45,z+10],[.3,.9,19.6],c)}
function cono(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const m=new THREE.Mesh(new THREE.ConeGeometry(.3,.85,12),new THREE.MeshLambertMaterial({color:0xff6a00}));m.position.y=.5;g.add(m);
 const f=new THREE.Mesh(new THREE.CylinderGeometry(.17,.21,.14,12),new THREE.MeshLambertMaterial({color:0xffffff}));f.position.y=.55;g.add(f);
 box([0,.04,0],[.7,.08,.7],0x222222,g);return g}
function ambulancia(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box([0,1,-.2],[1.7,1.5,3],0xffffff,g);box([0,.75,1.7],[1.6,1,1.3],0xffffff,g);box([0,1.05,2.36],[1.4,.4,.05],0x1b2a49,g);
 box([0,.7,-.2],[1.72,.22,3.02],0xd90429,g);
 for(const s of[-1,1]){box([s*.87,1.25,-.2],[.04,.7,.2],0xd90429,g);box([s*.87,1.25,-.2],[.04,.2,.7],0xd90429,g)}
 const l=box([0,1.82,.6],[1.3,.14,.3],0x1e90ff,g);l.material.emissive.setHex(0x1e90ff);
 for(const sx of[-.85,.85])for(const sz of[-1.1,1.5]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.25,14),new THREE.MeshLambertMaterial({color:0x111111}));w.rotation.z=Math.PI/2;w.position.set(sx,.35,sz);g.add(w)}
 return g}
const sh=new THREE.Shape();for(let i=0;i<10;i++){const r=i%2?.26:.58,a=i*Math.PI/5+Math.PI/2;i?sh.lineTo(Math.cos(a)*r,Math.sin(a)*r):sh.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
const sg=new THREE.ExtrudeGeometry(sh,{depth:.15,bevelEnabled:false});sg.center();
const sm=new THREE.MeshLambertMaterial({color:0xffd60a,emissive:0xb38600});
const obst=[],carriles=[-3.5,0,3.5];
for(let z=60,k=0;z<LARGO-20;z+=18,k++){
 if(pads.some(p=>z>p-6&&z<p+20))continue;
 const a=(k*5+1)%3,lanes=[a];
 if(k%9==5){const x=carriles[a];obst.push({x,z,hw:1.7,hl:2.6,t:"a",g:[ambulancia(x,z)]})}
 else if(k%4==2){const x=carriles[a];const g=[-.6,0,.6].map(d=>cono(x+d,z));obst.push({x,z,hw:1.6,hl:1.2,t:"c",g})}
 else{if(k%3==0)lanes.push((a+1+(k%2))%3);
  for(const l of lanes){const x=carriles[l];box([x,.65,z],[1.1,1.3,1.1],lanes.length>1?0xf2a007:0xd9402e);obst.push({x,z,hw:1.3,hl:1.6,t:"o"})}}
 if(k%2==0){const fr=[0,1,2].find(i=>!lanes.includes(i));const m=new THREE.Mesh(sg,sm);m.position.set(carriles[fr],1,z+9);scene.add(m);stars.push({m,x:carriles[fr],z:z+9})}
}
box([0,3.2,LARGO+2],[12,.6,.7],0xffffff);box([-5.7,1.5,LARGO+2],[.6,3,.7],0xffffff);box([5.7,1.5,LARGO+2],[.6,3,.7],0xffffff);

const R=0xe60a14,N=0x121214,W=0xffffff;
const part=(p,s,c)=>box(p,s,c,car);
part([0,.22,0],[.9,.3,3.2],R);part([0,.15,1.95],[.5,.2,1.1],R);part([0,.12,2.55],[.25,.14,.5],W);
part([-.68,.2,-.2],[.45,.26,1.5],R);part([.68,.2,-.2],[.45,.26,1.5],R);
part([0,.38,.2],[.18,.03,2.8],W);part([0,.45,-.35],[.55,.22,.9],N);
const casco=new THREE.Mesh(new THREE.SphereGeometry(.19,16,12),new THREE.MeshLambertMaterial({color:0xffd91a}));casco.position.set(0,.62,-.3);car.add(casco);
part([0,.62,-.85],[.3,.35,.5],N);
part([0,.07,2.75],[2,.06,.4],N);part([-1,.15,2.75],[.05,.25,.45],R);part([1,.15,2.75],[.05,.25,.45],R);
part([0,.85,-1.55],[1.7,.07,.45],N);part([0,.98,-1.6],[1.7,.05,.3],R);
part([-.86,.75,-1.55],[.05,.45,.55],R);part([.86,.75,-1.55],[.05,.45,.55],R);part([0,.55,-1.5],[.12,.6,.15],N);
const ruedas=[];
function rueda(x,y,z,d,a){const piv=new THREE.Group();piv.position.set(x,y,z);car.add(piv);
 const m=new THREE.Mesh(new THREE.CylinderGeometry(d/2,d/2,a,20),new THREE.MeshLambertMaterial({color:0x0d0d0d}));m.rotation.z=Math.PI/2;piv.add(m);
 const l=new THREE.Mesh(new THREE.CylinderGeometry(d*.28,d*.28,a*1.05,12),new THREE.MeshLambertMaterial({color:0xcfd2d8}));l.rotation.z=Math.PI/2;piv.add(l);ruedas.push(piv)}
rueda(-.98,.05,1.45,.46,.26);rueda(.98,.05,1.45,.46,.26);rueda(-1.02,.08,-1.15,.58,.38);rueda(1.02,.08,-1.15,.58,.38);

// estado
let started=false,padIn=false,nStars=0,vel=0,dist=0,turbo=0,choque=0,pts=0,niv=1,pAct=-1,pAbierta=false,fin=false,tiempo=0,msgT=0,px=0;
const keys={up:0,down:0,left:0,right:0};
const $=id=>document.getElementById(id);
function msg(t,s){$("msg").textContent=t;$("msg").style.display="block";msgT=s}
$("jugar").onclick=()=>{$("portada").style.display="none";document.body.classList.add("jugando");started=true;last=performance.now();msg("Nivel 1: Anatomía humana. ¡Recoge estrellas y esquiva obstáculos!",6)};
function turboOn(){if(turbo<=0&&pts>=10&&!pAbierta&&!fin){turbo=TURBO_T;pts-=10;msg("¡TURBO ACTIVADO!",2)}}
addEventListener("keydown",e=>{const k=e.code;
 if(k=="KeyW"||k=="ArrowUp")keys.up=1;if(k=="KeyS"||k=="ArrowDown")keys.down=1;
 if(k=="KeyA"||k=="ArrowLeft")keys.left=1;if(k=="KeyD"||k=="ArrowRight")keys.right=1;
 if(k=="Space"){e.preventDefault();turboOn()}});
addEventListener("keyup",e=>{const k=e.code;
 if(k=="KeyW"||k=="ArrowUp")keys.up=0;if(k=="KeyS"||k=="ArrowDown")keys.down=0;
 if(k=="KeyA"||k=="ArrowLeft")keys.left=0;if(k=="KeyD"||k=="ArrowRight")keys.right=0});
[["bu","up"],["bd","down"],["bl","left"],["br","right"]].forEach(([id,k])=>{const b=$(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=1});
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
$("bt").addEventListener("pointerdown",e=>{e.preventDefault();turboOn()});

function pregunta(i){pAbierta=true;vel=0;const q=Q[i],m=$("modal");
 m.innerHTML="<h3>¡Pregunta de Obstetricia!</h3><p></p>";m.querySelector("p").textContent=q[0];
 q[1].forEach((o,j)=>{const b=document.createElement("button");b.textContent=o;
  b.onclick=()=>{if(j==q[2]){pts+=10;msg("¡Correcto! "+q[3]+" +10 puntos",4)}else msg("Respuesta incorrecta. "+q[3],4);
   pAbierta=false;vel=CRUCERO;m.style.display="none"};m.appendChild(b)});
 m.style.display="block"}
function final(){const m=$("modal");m.innerHTML="<h3>¡CARRERA COMPLETADA!</h3><p>Has completado los cuatro niveles.<br>Puntuación final: "+pts+"<br>Estrellas: "+nStars+"/"+stars.length+"<br>Tiempo total: "+tiempo.toFixed(1)+" s</p><button onclick=\"location.reload()\">Volver a jugar</button>";m.style.display="block"}

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(started&&!fin&&!pAbierta){
  tiempo+=dt;
  const max=VMAX*(turbo>0?TURBO_X:1);
  if(keys.up)vel=approach(vel,max,ACEL*(turbo>0?1.8:1)*dt);else vel=approach(vel,CRUCERO,ACEL*.35*dt);
  if(keys.down)vel=approach(vel,0,ACEL*2.2*dt);
  if(turbo>0)turbo-=dt;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  px=Math.max(-5.2,Math.min(5.2,px+dir*LAT*dt));dist+=vel*dt;
  car.position.set(-px,.35,dist+2);
  car.rotation.y+=((-dir*.1)-car.rotation.y)*Math.min(1,8*dt);
  car.rotation.z+=((-dir*.06)-car.rotation.z)*Math.min(1,8*dt);
  ruedas.forEach(r=>r.rotation.x+=vel*dt*3);
  const cx=car.position.x,cz=dist+2;
  if(choque>0)choque-=dt;else for(const o of obst){if(o.dead)continue;if(Math.abs(o.z-cz)<o.hl&&Math.abs(o.x-cx)<o.hw){
   if(o.t=="c"){vel=Math.min(vel,28);o.dead=true;o.g.forEach(c=>c.visible=false);choque=.5;msg("¡Conos! Pierdes velocidad.",1.2)}
   else if(o.t=="a"){vel=Math.min(vel,6);turbo=0;choque=1.5;msg("¡Chocaste con una ambulancia!",1.5)}
   else{vel=Math.min(vel,10);turbo=0;choque=1.5;msg("¡Choque! Pierdes velocidad.",1.5)}break}}
  for(const t of stars){if(!t.got&&Math.abs(t.x-cx)<1.4&&Math.abs(t.z-cz)<1.8){t.got=true;t.m.visible=false;pts+=5;nStars++;msg("⭐ +5 puntos",.8)}}
  const enPad=pads.some(p=>cz>p&&cz<p+14);
  if(enPad){if(!padIn)msg("⚡ ¡Zona de turbo!",1.5);turbo=Math.max(turbo,1.2);vel=approach(vel,VMAX*TURBO_X,ACEL*2*dt)}padIn=enPad;
  const nn=Math.min(4,Math.floor(dist/NIVEL)+1);
  if(nn!=niv){niv=nn;msg("¡Nivel "+niv+": "+NOMBRES[niv-1]+"!",3)}
  const idx=Math.floor(dist/INTERV);
  if(dist>12&&idx>pAct&&idx<Q.length){pAct=idx;pregunta(idx)}
  if(dist>=LARGO){fin=true;vel=0;final()}
  if(msgT>0){msgT-=dt;if(msgT<=0)$("msg").style.display="none"}
 }
 stars.forEach(t=>{if(!t.got)t.m.rotation.y+=2*dt});
 const f=Math.min(1,vel/VMAX);
 const tgt=new THREE.Vector3(car.position.x,car.position.y+3.4+f,car.position.z-7.5-f*2.5);
 cam.position.lerp(tgt,Math.min(1,7*dt));
 cam.lookAt(car.position.x,car.position.y+.8,car.position.z+5);
 cam.fov+=((60+f*22+(turbo>0?10:0))-cam.fov)*Math.min(1,4*dt);cam.updateProjectionMatrix();
 $("hud").innerHTML="<b>CARRERA OBSTÉTRICA 3D</b><br>Nivel "+niv+": "+NOMBRES[niv-1]+"<br>Distancia: "+Math.min(LARGO,Math.floor(dist))+" / "+LARGO+" m<br>Puntos: "+pts+" | Turbo: "+(pts>=10?"LISTO":"10 pts")+"<br>Velocidad: "+Math.floor(vel*3.6)+" km/h<br>⭐ "+nStars+"/"+stars.length+"<br>Tiempo: "+tiempo.toFixed(1)+" s";
 renderer.render(scene,cam)}
function approach(a,b,d){return a<b?Math.min(a+d,b):Math.max(a-d,b)}
requestAnimationFrame(loop);
</script></body></html>
